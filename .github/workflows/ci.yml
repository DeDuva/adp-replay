name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Format check
        run: python -m ruff format --check src tests

      - name: Types
        run: python -m mypy

      - name: Test
        run: python -m pytest -m "not contract"

  # Contract tests run against a real ADP, pinned by image digest until ADP
  # serves a pinnable API version (docs/execution-plan.md §2). Separate job so a
  # contract break is distinguishable at a glance from a unit-test break.
  contract:
    runs-on: ubuntu-latest
    # Enable once the ADP image reference below is filled in (Task 1.1
    # prerequisite). Left off rather than green-but-empty: a job that passes
    # without asserting anything is worse than one that is visibly absent.
    if: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Contract tests
        env:
          ADP_BASE_URL: http://localhost:3000
          ADP_TOKEN: ci-test-token
        run: python -m pytest -m contract
