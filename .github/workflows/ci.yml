name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Format check
        run: python -m ruff format --check src tests

      - name: Types
        run: python -m mypy

      # The generated client must match the vendored spec. Without this, a
      # hand-edit to the generated file survives review and the "generated from
      # the spec" claim quietly stops being true.
      - name: Generated client is current
        run: python tools/generate_adp_client.py --check

      - name: Test
        run: python -m pytest -m "not contract"

  # Contract tests run against a real ADP, pinned by commit sha. Separate job so
  # a contract break is distinguishable at a glance from a unit-test break.
  #
  # ADP publishes no container image, so it is pinned by source revision rather
  # than by image digest — the same guarantee by a different mechanism. Bump
  # ADP_REF and re-run `make sync-spec && make generate` together; they are one
  # change, and splitting them is how a client drifts from its contract.
  contract:
    runs-on: ubuntu-latest
    env:
      ADP_REF: f3da971529e5c20e515e3d15c06248672b4539e8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adp
          POSTGRES_PASSWORD: adp
          POSTGRES_DB: adp
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check out ADP at the pinned revision
        uses: actions/checkout@v4
        with:
          repository: DeDuva/adp
          ref: ${{ env.ADP_REF }}
          path: .adp

      - name: The vendored spec matches the pinned ADP
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          vendored = json.loads(pathlib.Path("spec/adp-openapi.json").read_text())["info"]["version"]
          upstream = re.search(
              r"^  version: (.+)$",
              pathlib.Path(".adp/spec/openapi.yaml").read_text(),
              re.MULTILINE,
          ).group(1).strip()
          if vendored != upstream:
              sys.exit(
                  f"vendored spec is {vendored}, pinned ADP serves {upstream}. "
                  "Run: make sync-spec && make generate"
              )
          print(f"vendored spec matches pinned ADP at {vendored}")
          PY

      - name: Install ADP
        working-directory: .adp/server
        run: npm ci

      - name: Start ADP
        working-directory: .adp/server
        env:
          DATABASE_URL: postgres://adp:adp@localhost:5432/adp
          GIT_ROOT: ${{ github.workspace }}/.adp-git
          PORT: "3999"
          PUBLIC_URL: http://localhost:3999
          # Throwaway keys for a throwaway instance. They have to be *present*
          # because ADP refuses to start unsigned, which is the right default;
          # nothing here outlives the job.
          SIGNING_KEY: ci-contract-signing-key
          MIRROR_CREDENTIAL_KEY: ci-contract-mirror-key
        run: |
          mkdir -p "$GIT_ROOT"
          npx tsx src/db/migrate.ts
          echo "ADP_RUNNER_TOKEN=$(npx tsx src/bootstrap.ts replay-runner | awk '/^Token:/{print $2}')" >> "$GITHUB_ENV"
          echo "ADP_SCORER_TOKEN=$(npx tsx src/bootstrap.ts replay-scorer | awk '/^Token:/{print $2}')" >> "$GITHUB_ENV"
          npx tsx src/main.ts &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3999/healthz && break
            sleep 2
          done

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Contract tests
        env:
          ADP_BASE_URL: http://localhost:3999
        run: python -m pytest -m contract
